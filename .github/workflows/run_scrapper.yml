name: Run IMPDS Scraper

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ Install Chrome properly
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # ✅ Install matching ChromeDriver automatically
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: pip install selenium

      - name: Run Scraper
        run: python test_7.py

      - name: Commit and push CSV
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *.csv || echo "No CSV generated"
          git commit -m "Auto-updated scraped district data [Skip CI]" || exit 0
          git push