name: Run IMPDS Scraper

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year'
        default: '2023'
      month:
        description: 'Month'
        default: '4'

jobs:
  scrape:
    strategy:
      fail-fast: false   # if one chunk fails, others keep running
      matrix:
        include:
          - start: 0
            end: 9
          - start: 9
            end: 18
          - start: 18
            end: 27
          - start: 27
            end: 99

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: pip install selenium

      - name: Run Scraper
        run: |
          python impds_scraper_sql_3.py \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --year ${{ github.event.inputs.year || '2023' }} \
            --month ${{ github.event.inputs.month || '4' }}

      - name: Upload DB chunk
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.start }}-${{ matrix.end }}
          path: "*.db"

  merge:
    needs: scrape   # waits for ALL 4 scrape jobs to finish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download all DB chunks
        uses: actions/download-artifact@v4
        with:
          path: dbs/

      - name: Merge DBs
        run: |
          python merge.py \
            ${{ github.event.inputs.year || '2023' }} \
            ${{ github.event.inputs.month || '4' }}

      - name: Commit and push final DB
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *_FINAL.db || echo "No DB generated"
          git commit -m "Auto-updated scraped district data [skip ci]" || exit 0
          git push